<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2c5282"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid pattern -->
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo mark -->
  <rect x="80" y="245" width="80" height="80" rx="12" fill="#d69e2e"/>
  <text x="120" y="300" dominant-baseline="central" text-anchor="middle"
        fill="#1a365d" font-family="Georgia, serif" font-size="52" font-weight="bold">D</text>

  <!-- Title -->
  <text x="190" y="270" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700">Democracy Direct</text>

  <!-- Tagline -->
  <text x="190" y="330" fill="#d69e2e" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500">Your Voice, Your Representatives</text>

  <!-- Description -->
  <text x="80" y="450" fill="rgba(255,255,255,0.8)" font-family="system-ui, -apple-system, sans-serif" font-size="24">Find and contact your elected officials</text>
  <text x="80" y="490" fill="rgba(255,255,255,0.8)" font-family="system-ui, -apple-system, sans-serif" font-size="24">with privacy-first letter templates</text>

  <!-- URL -->
  <text x="80" y="580" fill="rgba(255,255,255,0.5)" font-family="system-ui, -apple-system, sans-serif" font-size="20">democracy-direct.com</text>
</svg>
