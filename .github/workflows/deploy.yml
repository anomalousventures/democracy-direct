name: Deploy

on:
  check_run:
    types: [completed]

permissions:
  contents: read
  deployments: write

jobs:
  production:
    name: Production
    if: |
      github.event.check_run.app.slug == 'cloudflare-pages' &&
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.check_suite.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://democracy-direct.com
    steps:
      - name: Create GitHub Deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ github.event.check_run.head_sha }}',
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Deploy to production',
              production_environment: true,
            });

            if (deployment.status === 201) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: 'success',
                environment_url: 'https://democracy-direct.com',
                description: 'Deployed to Cloudflare Pages',
              });
            }

  preview:
    name: Preview
    if: |
      github.event.check_run.app.slug == 'cloudflare-pages' &&
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.check_suite.head_branch != 'main'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ github.event.check_run.details_url }}
    steps:
      - name: Create GitHub Deployment
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ github.event.check_run.check_suite.head_branch }}';
            const detailsUrl = '${{ github.event.check_run.details_url }}';

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ github.event.check_run.head_sha }}',
              environment: 'preview',
              auto_merge: false,
              required_contexts: [],
              description: `Preview for ${branch}`,
              production_environment: false,
            });

            if (deployment.status === 201) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: 'success',
                environment_url: detailsUrl || `https://${branch}.democracy-direct.pages.dev`,
                description: 'Preview deployed to Cloudflare Pages',
              });
            }
