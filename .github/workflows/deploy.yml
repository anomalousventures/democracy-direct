name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Deployment
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const isProd = context.ref === 'refs/heads/main';
            const environment = isProd ? 'production' : 'preview';

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment,
              auto_merge: false,
              required_contexts: [],
              description: `Deploy to ${environment}`,
            });

            if (deployment.status === 201) {
              return deployment.data.id;
            }
            return null;

      - name: Wait for Cloudflare Pages
        run: sleep 30

      - name: Get Cloudflare deployment URL
        id: cf-url
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "url=https://democracy-direct.com" >> $GITHUB_OUTPUT
          else
            echo "url=https://${{ github.head_ref }}.democracy-direct.pages.dev" >> $GITHUB_OUTPUT
          fi

      - name: Update deployment status
        uses: actions/github-script@v7
        if: steps.deployment.outputs.result != 'null'
        with:
          script: |
            const deploymentId = ${{ steps.deployment.outputs.result }};
            const isProd = context.ref === 'refs/heads/main';

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              environment_url: '${{ steps.cf-url.outputs.url }}',
              description: 'Deployed to Cloudflare Pages',
            });
