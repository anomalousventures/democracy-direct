name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  production:
    name: Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://democracy-direct.com
    steps:
      - name: Create GitHub Deployment
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Deploy to production',
              production_environment: true,
            });

            if (deployment.status === 201) {
              return deployment.data.id;
            }
            return null;

      - name: Wait for Cloudflare Pages
        run: sleep 60

      - name: Update deployment status
        uses: actions/github-script@v7
        if: steps.deployment.outputs.result != 'null'
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              environment_url: 'https://democracy-direct.com',
              description: 'Deployed to Cloudflare Pages',
            });

  preview:
    name: Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://${{ github.head_ref }}.democracy-direct.pages.dev
    steps:
      - name: Create GitHub Deployment
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'preview',
              auto_merge: false,
              required_contexts: [],
              description: 'Deploy preview for PR #${{ github.event.pull_request.number }}',
              production_environment: false,
            });

            if (deployment.status === 201) {
              return deployment.data.id;
            }
            return null;

      - name: Wait for Cloudflare Pages
        run: sleep 60

      - name: Update deployment status
        uses: actions/github-script@v7
        if: steps.deployment.outputs.result != 'null'
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              environment_url: 'https://${{ github.head_ref }}.democracy-direct.pages.dev',
              description: 'Preview deployed to Cloudflare Pages',
            });
