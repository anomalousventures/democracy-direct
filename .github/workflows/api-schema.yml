name: API Schema

on:
  push:
    branches: [main]
    paths:
      - "src/pages/api/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate API Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API schema
        run: pnpm generate:api-schema

      - name: Upload schema artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-schema
          path: api-schema.json

      - name: Send Discord notification
        if: always()
        env:
          DISCORD_NOTIFICATIONS_WEBHOOK: ${{ secrets.DISCORD_NOTIFICATIONS_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: |
          GH_RUN="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -f api-schema.json ]; then
            ROUTE_COUNT=$(jq '.paths | length' api-schema.json)
            METHOD_COUNT=$(jq '[.paths[] | keys[]] | length' api-schema.json)

            DESC=$(printf 'API schema regenerated from source.\n\n**%s routes, %s operations**\n\nThe schema JSON is attached below. Upload to Cloudflare API Shield.' "$ROUTE_COUNT" "$METHOD_COUNT")

            .github/scripts/discord-notify.sh \
              --level success \
              --title "🟦 API Schema Updated" \
              --color 3447003 \
              --description "$DESC" \
              --button "View Run|$GH_RUN" \
              --file api-schema.json
          else
            .github/scripts/discord-notify.sh \
              --level alert \
              --title "🚨 API Schema Generation Failed" \
              --color 15158332 \
              --description "Schema generation did not produce api-schema.json. Check the build logs." \
              --button "View Run|$GH_RUN"
          fi
