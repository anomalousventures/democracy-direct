name: Accessibility & Performance Audit

on:
  deployment_status:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Deployment URL to audit"
        required: true
        type: string
      pr_number:
        description: "PR number to comment on (optional)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  deployments: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.check_run.app.slug || 'deploy' }}-${{ github.event.deployment.sha || github.event.check_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    name: Lighthouse & Pa11y
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.deployment_status.state == 'success' ||
      (github.event_name == 'check_run' &&
       github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
       github.event.check_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v6

      - name: Get deployment URL and PR number
        id: deployment
        uses: actions/github-script@v9.0.0
        with:
          script: |
            let deploymentUrl, prNumber;

            if (context.eventName === 'workflow_dispatch') {
              deploymentUrl = '${{ inputs.deployment_url }}';
              prNumber = '${{ inputs.pr_number }}' || null;
              console.log('Manual trigger');
            } else if (context.eventName === 'check_run') {
              const sha = context.payload.check_run.head_sha;
              console.log(`Check run event - Commit SHA: ${sha}`);

              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                sort: 'updated',
                direction: 'desc',
                per_page: 100
              });

              const pr = prs.find(p => p.head.sha === sha);
              prNumber = pr ? pr.number : null;

              if (pr) {
                console.log(`Found PR #${pr.number} for commit ${sha}`);

                // Try to extract deployment URL from check run output
                const checkOutput = context.payload.check_run.output;
                if (checkOutput?.summary) {
                  const urlMatch = checkOutput.summary.match(/https:\/\/[a-z0-9-]+\.democracy-direct\.pages\.dev/);
                  if (urlMatch) {
                    deploymentUrl = urlMatch[0];
                    console.log(`Extracted URL from check output: ${deploymentUrl}`);
                  }
                }

                // If not found, query GitHub Deployments API
                // This avoids issues with Cloudflare's URL truncation
                if (!deploymentUrl) {
                  try {
                    const { data: deployments } = await github.rest.repos.listDeployments({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      sha: sha,
                      per_page: 10
                    });

                    console.log(`Found ${deployments.length} deployments for ${sha}`);

                    // Find the most recent successful deployment
                    for (const deployment of deployments) {
                      const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        deployment_id: deployment.id
                      });

                      const successStatus = statuses.find(s => s.state === 'success');
                      if (successStatus && successStatus.environment_url) {
                        deploymentUrl = successStatus.environment_url;
                        console.log(`Found deployment URL from API: ${deploymentUrl}`);
                        break;
                      }
                    }

                    if (!deploymentUrl) {
                      console.log('No successful deployment found, skipping audit');
                    }
                  } catch (error) {
                    console.log(`Error querying deployments: ${error.message}`);
                    deploymentUrl = null;
                  }
                }
              } else {
                console.log('No PR found for this commit, skipping audit');
                deploymentUrl = null;
              }
            } else {
              deploymentUrl = context.payload.deployment_status.target_url;
              const sha = context.payload.deployment.sha;

              console.log(`Deployment status event - Commit SHA: ${sha}`);

              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                sort: 'updated',
                direction: 'desc',
                per_page: 100
              });

              const pr = prs.find(p => p.head.sha === sha);
              prNumber = pr ? pr.number : null;
            }

            console.log(`Deployment URL: ${deploymentUrl}`);
            console.log(`PR Number: ${prNumber}`);

            core.setOutput('url', deploymentUrl || '');
            core.setOutput('pr_number', prNumber || '');

      - name: Install audit tools
        if: steps.deployment.outputs.url != ''
        run: |
          npm install -g @lhci/cli pa11y
          npx puppeteer browsers install chrome

      - name: Wait for deployment to be ready
        if: steps.deployment.outputs.url != ''
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.url }}
        run: |
          echo "Waiting for deployment to be ready..."
          for i in {1..30}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${DEPLOY_URL}/api/health" || echo "000")
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              echo "Deployment is ready (health returned $status)"
              exit 0
            fi
            echo "Attempt $i: health returned $status, waiting..."
            sleep 10
          done
          echo "Deployment not ready after 5 minutes, proceeding anyway"

      - name: Run Lighthouse audit
        if: steps.deployment.outputs.url != ''
        id: lighthouse
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.url }}
        run: |
          mkdir -p lighthouse-results
          lhci collect \
            --url="${DEPLOY_URL}" \
            --url="${DEPLOY_URL}/about" \
            --url="${DEPLOY_URL}/privacy" \
            --url="${DEPLOY_URL}/templates" \
            --url="${DEPLOY_URL}/roadmap" \
            --url="${DEPLOY_URL}/rep/S000033" \
            --url="${DEPLOY_URL}/reps/OR/3" \
            --settings.chromeFlags="--no-sandbox --headless" \
            || true

          lhci upload \
            --target=filesystem \
            --outputDir=./lighthouse-results \
            || true

      - name: Run Pa11y accessibility audit
        if: steps.deployment.outputs.url != ''
        id: pa11y
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.url }}
        run: |
          mkdir -p pa11y-results

          # Create pa11y config for Chrome sandbox settings
          cat > pa11y-config.json << 'EOF'
          {
            "chromeLaunchConfig": {
              "args": ["--no-sandbox", "--disable-setuid-sandbox"]
            }
          }
          EOF

          pa11y "${DEPLOY_URL}" --config pa11y-config.json --reporter json > pa11y-results/home.json || true
          pa11y "${DEPLOY_URL}/about" --config pa11y-config.json --reporter json > pa11y-results/about.json || true
          pa11y "${DEPLOY_URL}/privacy" --config pa11y-config.json --reporter json > pa11y-results/privacy.json || true
          pa11y "${DEPLOY_URL}/templates" --config pa11y-config.json --reporter json > pa11y-results/templates.json || true
          pa11y "${DEPLOY_URL}/roadmap" --config pa11y-config.json --reporter json > pa11y-results/roadmap.json || true
          pa11y "${DEPLOY_URL}/rep/S000033" --config pa11y-config.json --reporter json > pa11y-results/rep-detail.json || true
          pa11y "${DEPLOY_URL}/reps/OR/3" --config pa11y-config.json --reporter json > pa11y-results/reps-state-district.json || true

      - name: Generate audit summary
        if: steps.deployment.outputs.url != ''
        id: summary
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "## Accessibility & Performance Audit Results" > audit-summary.md
          echo "" >> audit-summary.md
          echo "**Deployment URL:** ${DEPLOY_URL}" >> audit-summary.md
          echo "" >> audit-summary.md

          echo "### Lighthouse Scores (averaged across 3 runs)" >> audit-summary.md
          echo "" >> audit-summary.md

          if [ -d ".lighthouseci" ]; then
            echo "| Page | Performance | Accessibility | Best Practices | SEO |" >> audit-summary.md
            echo "|------|-------------|---------------|----------------|-----|" >> audit-summary.md

            # Check if any Lighthouse run succeeded (has non-null scores)
            has_valid_scores=$(jq -s '[.[].categories.performance.score | select(. != null)] | length > 0' .lighthouseci/lhr-*.json 2>/dev/null || echo "false")

            if [ "$has_valid_scores" = "true" ]; then
              # Group results by URL and calculate averages (filtering out failed runs)
              jq -rs '
                [.[] | select(.categories.performance.score != null)] |
                group_by(.finalUrl) |
                map({
                  url: .[0].finalUrl,
                  perf: ([.[].categories.performance.score] | add / length * 100 | floor),
                  a11y: ([.[].categories.accessibility.score] | add / length * 100 | floor),
                  bp: ([.[].categories["best-practices"].score] | add / length * 100 | floor),
                  seo: ([.[].categories.seo.score] | add / length * 100 | floor)
                }) |
                sort_by(.url) |
                .[] |
                "| \(.url) | \(.perf) | \(.a11y) | \(.bp) | \(.seo) |"
              ' .lighthouseci/lhr-*.json >> audit-summary.md 2>/dev/null || echo "Error parsing Lighthouse results" >> audit-summary.md
            else
              # Check for runtime errors in Lighthouse output
              error_msg=$(jq -rs '.[0].runtimeError.message // empty' .lighthouseci/lhr-*.json 2>/dev/null | head -1)
              if [ -n "$error_msg" ]; then
                echo "⚠️ Lighthouse failed: $error_msg" >> audit-summary.md
              else
                echo "⚠️ No valid Lighthouse scores found" >> audit-summary.md
              fi
            fi

            echo "" >> audit-summary.md
            echo "[View full Lighthouse reports](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts)" >> audit-summary.md
          else
            echo "No Lighthouse results found." >> audit-summary.md
          fi

          echo "" >> audit-summary.md
          echo "### Pa11y Accessibility Issues" >> audit-summary.md
          echo "" >> audit-summary.md

          total_issues=0
          for file in pa11y-results/*.json; do
            if [ -f "$file" ] && [ -s "$file" ]; then
              page=$(basename "$file" .json)
              issues=$(jq -r 'if type == "array" then length else 0 end' "$file" 2>/dev/null)
              issues=${issues:-0}
              if [[ "$issues" =~ ^[0-9]+$ ]]; then
                total_issues=$((total_issues + issues))
                echo "- **$page**: $issues issues" >> audit-summary.md
              else
                echo "- **$page**: parse error" >> audit-summary.md
              fi
            elif [ -f "$file" ]; then
              page=$(basename "$file" .json)
              echo "- **$page**: no data (audit may have failed)" >> audit-summary.md
            fi
          done

          echo "" >> audit-summary.md
          echo "**Total Pa11y issues: $total_issues**" >> audit-summary.md

          if [ "$total_issues" -gt 0 ]; then
            echo "" >> audit-summary.md
            echo "<details>" >> audit-summary.md
            echo "<summary>View Pa11y Details</summary>" >> audit-summary.md
            echo "" >> audit-summary.md
            for file in pa11y-results/*.json; do
              if [ -f "$file" ]; then
                page=$(basename "$file" .json)
                issues=$(jq -r 'if type == "array" then . else [] end | .[] | "- [\(.type)] \(.message)"' "$file" 2>/dev/null || echo "")
                if [ -n "$issues" ]; then
                  echo "#### $page" >> audit-summary.md
                  echo "$issues" >> audit-summary.md
                  echo "" >> audit-summary.md
                fi
              fi
            done
            echo "</details>" >> audit-summary.md
          fi

          cat audit-summary.md

      - name: Post audit results to PR
        if: steps.deployment.outputs.url != '' && steps.deployment.outputs.pr_number != ''
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('audit-summary.md', 'utf8');
            const prNumber = parseInt('${{ steps.deployment.outputs.pr_number }}', 10);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Accessibility & Performance Audit Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: summary
              });
            }

      - name: Upload audit artifacts
        if: always() && steps.deployment.outputs.url != ''
        uses: actions/upload-artifact@v7
        with:
          name: audit-results
          path: |
            lighthouse-results/
            pa11y-results/
            .lighthouseci/
          retention-days: 14
