name: Production Smoke Tests

on:
  check_run:
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ github.event.check_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke Test Production
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
       github.event.check_run.conclusion == 'success' &&
       github.event.check_run.check_suite.head_branch == 'main')

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Wait for deployment propagation
        run: sleep 60

      - name: Run smoke tests
        run: pnpm exec playwright test tests/e2e/smoke.spec.ts --config=playwright.smoke.config.ts

      - name: Upload test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 7

      - name: Send Discord notification on failure
        if: failure()
        env:
          DISCORD_NOTIFICATIONS_WEBHOOK: ${{ secrets.DISCORD_NOTIFICATIONS_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: |
          GH_RUN="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          .github/scripts/discord-notify.sh \
            --level alert \
            --title "🚨 Smoke Test Failed" \
            --color 15158332 \
            --description "One or more smoke tests failed against production." \
            --button "View Run|$GH_RUN" \
            --button "Production|https://democracy-direct.com" \
            --button "Cloudflare|https://dash.cloudflare.com"
