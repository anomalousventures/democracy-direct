name: Backfill Bills

on:
  schedule:
    # Every 2 hours, avoiding 6:00 UTC (when refresh-data runs)
    # Rate limit optimization: reduces overlap with other Congress API jobs
    - cron: "0 0,2,4,8,10,12,14,16,18,20,22 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max bills to sync (default: 1500)"
        required: false
        type: number

permissions:
  contents: read

jobs:
  backfill:
    name: Backfill Historical Bills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync bills (backward)
        id: bills
        run: |
          set +e
          LIMIT_ARG=""
          if [ -n "${{ inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ inputs.limit }}"
          fi
          pnpm sync:bills -- --direction backward $LIMIT_ARG
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Send Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BILLS_RESULT: ${{ steps.bills.outputs.result }}
          BILLS_FAILED: ${{ steps.bills.outputs.failed }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL secret not configured, skipping notification"
            exit 0
          fi

          if [ -z "$BILLS_RESULT" ]; then
            echo "Warning: BILLS_RESULT is empty, using default values"
            BILLS_RESULT='{"changed":false,"billsUpserted":0,"congressNumber":"unknown","oldestCongress":"unknown","errors":[],"warnings":[]}'
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GH_RUN="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BILLS_CHANGED=$(echo "$BILLS_RESULT" | jq -r '.changed // false')
          BILLS_COUNT=$(echo "$BILLS_RESULT" | jq -r '.billsUpserted // 0')
          CONGRESS=$(echo "$BILLS_RESULT" | jq -r '.congressNumber // "unknown"')
          OLDEST=$(echo "$BILLS_RESULT" | jq -r '.oldestCongress // "unknown"')

          # Parse new cursor state fields
          CURRENT_SYNC=$(echo "$BILLS_RESULT" | jq -r '.cursorState.currentSyncCongress // "null"')
          CURRENT_OFFSET=$(echo "$BILLS_RESULT" | jq -r '.cursorState.currentOffset // "null"')
          FIRST_BILL_TYPE=$(echo "$BILLS_RESULT" | jq -r '.firstBill.type // ""')
          FIRST_BILL_NUM=$(echo "$BILLS_RESULT" | jq -r '.firstBill.number // ""')
          LAST_BILL_TYPE=$(echo "$BILLS_RESULT" | jq -r '.lastBill.type // ""')
          LAST_BILL_NUM=$(echo "$BILLS_RESULT" | jq -r '.lastBill.number // ""')

          # Parse errors (fatal issues that prevented bill processing)
          ERROR_COUNT=$(echo "$BILLS_RESULT" | jq -r '.errors | length // 0')
          SCHEMA_ISSUE_DETECTED="false"
          ERROR_SUMMARY=""

          if [ "$ERROR_COUNT" -gt 0 ]; then
            ERROR_SUMMARY=$(echo "$BILLS_RESULT" | jq -r '
              (.errors // [])
              | group_by(.message // "Unknown error")
              | map({
                  message: (.[0].message // "Unknown error"),
                  count: length
                })
              | map("\(.message): \(.count)")
              | join("\n")
            ')

            UNIQUE_ERRORS=$(echo "$BILLS_RESULT" | jq -r '(.errors // []) | [.[] | .message // empty] | unique | length')

            if [ "$UNIQUE_ERRORS" -eq 1 ]; then
              SCHEMA_ISSUE_DETECTED="true"
              echo "⚠️ WARNING: All $ERROR_COUNT bills failed with the same error:"
              echo "$ERROR_SUMMARY"
            else
              echo "ℹ️ Encountered $ERROR_COUNT errors across $UNIQUE_ERRORS unique error types:"
              echo "$ERROR_SUMMARY"
            fi
          fi

          # Parse warnings (recoverable issues like missing introducedDate with fallback)
          WARNING_COUNT=$(echo "$BILLS_RESULT" | jq -r '.warnings | length // 0')
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "ℹ️ $WARNING_COUNT bills processed with warnings (data recovered via fallbacks)"
          fi

          # Determine notification title, color, and status
          if [ "$BILLS_FAILED" = "true" ]; then
            TITLE="🚨 Bill Backfill Failed"
            COLOR=16711680
            STATUS="❌ **Bills**: Backfill failed"
          elif [ "$SCHEMA_ISSUE_DETECTED" = "true" ] && [ "$BILLS_COUNT" -eq 0 ]; then
            TITLE="⚠️ Bill Backfill - Schema Issue Detected"
            COLOR=16744192
            STATUS="⚠️ **Bills**: All $ERROR_COUNT bills failed with same error"
            STATUS="${STATUS}\n\`\`\`"
            STATUS="${STATUS}\n${ERROR_SUMMARY}"
            STATUS="${STATUS}\n\`\`\`"
            STATUS="${STATUS}\n**This suggests a schema or code issue, not data problems.**"
          elif [ "$ERROR_COUNT" -gt 0 ] && [ "$BILLS_COUNT" -eq 0 ]; then
            TITLE="🚨 Bill Backfill - All Bills Failed"
            COLOR=16711680
            STATUS="❌ **Bills**: All bills failed ($ERROR_COUNT errors across $UNIQUE_ERRORS types)\nCheck logs for error breakdown."
          elif [ "$BILLS_CHANGED" = "true" ]; then
            TITLE="📊 Bill Backfill Complete"
            COLOR=65280

            # Build bill range info
            BILL_RANGE=""
            if [ -n "$FIRST_BILL_TYPE" ] && [ -n "$LAST_BILL_TYPE" ]; then
              FIRST_BILL=$(echo "${FIRST_BILL_TYPE}${FIRST_BILL_NUM}" | tr '[:lower:]' '[:upper:]')
              LAST_BILL=$(echo "${LAST_BILL_TYPE}${LAST_BILL_NUM}" | tr '[:lower:]' '[:upper:]')
              BILL_RANGE=" (${FIRST_BILL} → ${LAST_BILL})"
            fi

            if [ "$OLDEST" = "null" ] || [ "$OLDEST" = "unknown" ]; then
              STATUS="✅ **Bills**: ${BILLS_COUNT} from Congress ${CONGRESS}${BILL_RANGE}"
            else
              STATUS="✅ **Bills**: ${BILLS_COUNT} from Congress ${CONGRESS}${BILL_RANGE}\n📌 **Oldest synced**: Congress ${OLDEST}"
            fi

            # Show partial sync progress
            if [ "$CURRENT_SYNC" != "null" ] && [ "$CURRENT_OFFSET" != "null" ]; then
              STATUS="${STATUS}\n⏳ **In progress**: Congress ${CURRENT_SYNC} at offset ${CURRENT_OFFSET}"
            fi

            if [ "$ERROR_COUNT" -gt 0 ]; then
              STATUS="${STATUS}\n⚠️ **Errors**: ${ERROR_COUNT} bills could not be processed"
            fi
            if [ "$WARNING_COUNT" -gt 0 ]; then
              STATUS="${STATUS}\nℹ️ **Warnings**: ${WARNING_COUNT} bills used date fallbacks"
            fi
          else
            TITLE="✅ Bill Backfill - Complete"
            COLOR=8421504
            STATUS="⏭️ **Bills**: Backfill complete to target Congress"
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg status "$STATUS" \
            --arg gh_run "$GH_RUN" \
            --arg timestamp "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  { name: "Results", value: $status, inline: false },
                  { name: "Links", value: "[View Run](\($gh_run))", inline: false }
                ],
                timestamp: $timestamp
              }]
            }')

          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"

      - name: Fail workflow if backfill failed
        if: steps.bills.outputs.failed == 'true'
        run: |
          echo "Bill backfill failed - check logs above for details"
          exit 1

      - name: Fail workflow if schema issue detected
        if: steps.bills.outputs.failed != 'true'
        run: |
          BILLS_RESULT='${{ steps.bills.outputs.result }}'

          if [ -z "$BILLS_RESULT" ] || [ "$BILLS_RESULT" = "{}" ]; then
            echo "No result data available, skipping schema check"
            exit 0
          fi

          # Only check errors (not warnings) for schema issues
          ERROR_COUNT=$(echo "$BILLS_RESULT" | jq -r '.errors | length // 0')
          BILLS_COUNT=$(echo "$BILLS_RESULT" | jq -r '.billsUpserted // 0')
          WARNING_COUNT=$(echo "$BILLS_RESULT" | jq -r '.warnings | length // 0')

          # Log warnings as informational (these are expected data variations)
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "ℹ️ $WARNING_COUNT bills processed with warnings (used date fallbacks)"
          fi

          if [ "$ERROR_COUNT" -gt 0 ]; then
            UNIQUE_ERRORS=$(echo "$BILLS_RESULT" | jq -r '(.errors // []) | [.[] | .message // empty] | unique | length')

            ERROR_SUMMARY=$(echo "$BILLS_RESULT" | jq -r '
              (.errors // [])
              | group_by(.message // "Unknown error")
              | map({
                  message: (.[0].message // "Unknown error"),
                  count: length
                })
              | map("  \(.message): \(.count)")
              | join("\n")
            ')

            # If all errors are identical and no bills succeeded, fail the workflow
            if [ "$UNIQUE_ERRORS" -eq 1 ] && [ "$BILLS_COUNT" -eq 0 ]; then
              echo "❌ SCHEMA ISSUE DETECTED ❌"
              echo "All $ERROR_COUNT bills failed with the same error:"
              echo "$ERROR_SUMMARY"
              echo ""
              echo "This indicates a problem with the schema or code, not the data."
              exit 1
            fi

            if [ "$UNIQUE_ERRORS" -eq 1 ]; then
              echo "⚠️ Warning: All $ERROR_COUNT errors have the same message:"
              echo "$ERROR_SUMMARY"
              echo "This may indicate a schema issue. Investigate if error rate is high."
            else
              echo "ℹ️ Encountered $ERROR_COUNT errors across $UNIQUE_ERRORS unique types:"
              echo "$ERROR_SUMMARY"
            fi
          fi

          echo "Schema check complete"
          exit 0
