name: Refresh Data

on:
  schedule:
    # Run daily at 6am UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-data:
    name: Refresh Cached Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import legislators
        id: legislators
        run: |
          set +e
          OUTPUT=$(pnpm import:legislators 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          JSON=$(echo "$OUTPUT" | grep -E '^\{' | head -1 || echo '{}')
          echo "result=$JSON" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -ne 0 ] || echo "$OUTPUT" | grep -q "Import failed"; then
            echo "failed=true" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Import ZIP districts
        id: zips
        run: |
          set +e
          OUTPUT=$(pnpm import:zips 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          JSON=$(echo "$OUTPUT" | grep -E '^\{' | head -1 || echo '{}')
          echo "result=$JSON" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -ne 0 ] || echo "$OUTPUT" | grep -q "Import failed"; then
            echo "failed=true" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Seed templates
        id: templates
        run: |
          set +e
          OUTPUT=$(pnpm seed:templates 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Sync voting records
        id: votes
        run: |
          set +e
          OUTPUT=$(pnpm sync:votes 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          JSON=$(echo "$OUTPUT" | grep -E '^\{' | head -1 || echo '{}')
          echo "result=$JSON" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -ne 0 ] || echo "$OUTPUT" | grep -q "Sync failed"; then
            echo "failed=true" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Sync bills (forward)
        id: bills
        run: |
          set +e
          pnpm sync:bills -- --direction forward
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Export ZIP data if changed
        id: export
        if: steps.zips.outputs.failed != 'true'
        run: |
          ZIPS_CHANGED=$(echo '${{ steps.zips.outputs.result }}' | jq -r '.changed // false')
          if [ "$ZIPS_CHANGED" = "true" ]; then
            echo "ZIP data changed, exporting..."
            pnpm export:zips
            echo "exported=true" >> $GITHUB_OUTPUT
          else
            echo "No ZIP changes, skipping export"
            echo "exported=false" >> $GITHUB_OUTPUT
          fi
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Create PR for data updates
        if: steps.export.outputs.exported == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet public/data/zip-districts.json; then
            echo "No changes to zip-districts.json"
            exit 0
          fi

          BRANCH="data/zip-districts-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/data/zip-districts.json
          git commit -m "data: Update zip-districts.json from Census"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "data: Update zip-districts.json" \
            --body "Automated update of ZIP-district mappings from Census Bureau data." \
            --base main \
            --head "$BRANCH"

      - name: Send Discord notification
        if: always()
        env:
          DISCORD_SUCCESS_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ALERT_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LEGISLATORS_RESULT: ${{ steps.legislators.outputs.result }}
          LEGISLATORS_FAILED: ${{ steps.legislators.outputs.failed }}
          ZIPS_RESULT: ${{ steps.zips.outputs.result }}
          ZIPS_FAILED: ${{ steps.zips.outputs.failed }}
          TEMPLATES_FAILED: ${{ steps.templates.outputs.failed }}
          VOTES_RESULT: ${{ steps.votes.outputs.result }}
          VOTES_FAILED: ${{ steps.votes.outputs.failed }}
          BILLS_RESULT: ${{ steps.bills.outputs.result }}
          BILLS_FAILED: ${{ steps.bills.outputs.failed }}
        run: |
          # Parse results
          LEG_CHANGED=$(echo "$LEGISLATORS_RESULT" | jq -r '.changed // false')
          LEG_COUNT=$(echo "$LEGISLATORS_RESULT" | jq -r '.recordsUpserted // 0')
          LEG_SHA=$(echo "$LEGISLATORS_RESULT" | jq -r '.commitSha // null | if . == null then "unknown" else .[0:7] end')

          ZIPS_CHANGED=$(echo "$ZIPS_RESULT" | jq -r '.changed // false')
          ZIPS_COUNT=$(echo "$ZIPS_RESULT" | jq -r '.recordsInserted // 0')

          VOTES_CHANGED=$(echo "$VOTES_RESULT" | jq -r '.changed // false')
          VOTES_HOUSE=$(echo "$VOTES_RESULT" | jq -r '.houseVotesUpserted // 0')
          VOTES_SENATE=$(echo "$VOTES_RESULT" | jq -r '.senateVotesUpserted // 0')

          BILLS_CHANGED=$(echo "$BILLS_RESULT" | jq -r '.changed // false')
          BILLS_COUNT=$(echo "$BILLS_RESULT" | jq -r '.billsUpserted // 0')

          # Determine overall status
          if [ "$LEGISLATORS_FAILED" = "true" ] || [ "$ZIPS_FAILED" = "true" ] || [ "$TEMPLATES_FAILED" = "true" ] || [ "$VOTES_FAILED" = "true" ] || [ "$BILLS_FAILED" = "true" ]; then
            TITLE="🚨 Data Refresh Failed"
            COLOR=15158332
            LEVEL=alert
          elif [ "$LEG_CHANGED" = "true" ] || [ "$ZIPS_CHANGED" = "true" ] || [ "$VOTES_CHANGED" = "true" ] || [ "$BILLS_CHANGED" = "true" ]; then
            TITLE="📊 Data Refresh Complete"
            COLOR=3066993
            LEVEL=success
          else
            TITLE="✅ Data Refresh - No Changes"
            COLOR=9807270
            LEVEL=success
          fi

          # Build status lines
          if [ "$LEGISLATORS_FAILED" = "true" ]; then
            LEG_STATUS="❌ **Legislators**: Failed"
          elif [ "$LEG_CHANGED" = "true" ]; then
            LEG_STATUS="✅ **Legislators**: ${LEG_COUNT} upserted (SHA: ${LEG_SHA})"
          else
            LEG_STATUS="⏭️ **Legislators**: Unchanged (SHA: ${LEG_SHA})"
          fi

          if [ "$ZIPS_FAILED" = "true" ]; then
            ZIPS_STATUS="❌ **ZIP Districts**: Failed"
          elif [ "$ZIPS_CHANGED" = "true" ]; then
            ZIPS_STATUS="✅ **ZIP Districts**: ${ZIPS_COUNT} inserted"
          else
            ZIPS_STATUS="⏭️ **ZIP Districts**: Unchanged"
          fi

          if [ "$TEMPLATES_FAILED" = "true" ]; then
            TEMPLATES_STATUS="❌ **Templates**: Failed"
          else
            TEMPLATES_STATUS="✅ **Templates**: Seeded"
          fi

          if [ "$VOTES_FAILED" = "true" ]; then
            VOTES_STATUS="❌ **Votes**: Failed"
          elif [ "$VOTES_CHANGED" = "true" ]; then
            VOTES_STATUS="✅ **Votes**: ${VOTES_HOUSE} House, ${VOTES_SENATE} Senate"
          else
            VOTES_STATUS="⏭️ **Votes**: Unchanged"
          fi

          if [ "$BILLS_FAILED" = "true" ]; then
            BILLS_STATUS="❌ **Bills**: Failed"
          elif [ "$BILLS_CHANGED" = "true" ]; then
            BILLS_STATUS="✅ **Bills**: ${BILLS_COUNT} upserted"
          else
            BILLS_STATUS="⏭️ **Bills**: Unchanged"
          fi

          DESC="${LEG_STATUS}"$'\n'"${ZIPS_STATUS}"$'\n'"${TEMPLATES_STATUS}"$'\n'"${VOTES_STATUS}"$'\n'"${BILLS_STATUS}"

          GH_RUN="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          .github/scripts/discord-notify.sh \
            --level "$LEVEL" \
            --title "$TITLE" \
            --color "$COLOR" \
            --description "$DESC" \
            --button "View Run|$GH_RUN"

      - name: Fail workflow if imports failed
        if: steps.legislators.outputs.failed == 'true' || steps.zips.outputs.failed == 'true' || steps.templates.outputs.failed == 'true' || steps.votes.outputs.failed == 'true' || steps.bills.outputs.failed == 'true'
        run: |
          echo "One or more imports failed"
          exit 1
