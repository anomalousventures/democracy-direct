name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-branch-name:
    name: Setup Branch Name
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5 # v8

  lighthouse:
    name: Lighthouse Audit
    needs: [setup-branch-name]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create Neon preview branch
        id: create_branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: lighthouse/pr-${{ github.event.number }}-${{ needs.setup-branch-name.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set DATABASE_URL
        run: |
          DB_URL="${BRANCH_DB_URL_POOLED:-${BRANCH_DB_URL:-${FALLBACK_DB_URL}}}"
          if [ -z "$DB_URL" ]; then
            echo "ERROR: DATABASE_URL could not be resolved"
            exit 1
          fi
          echo "DATABASE_URL=${DB_URL}" >> "$GITHUB_ENV"
        env:
          BRANCH_DB_URL_POOLED: ${{ steps.create_branch.outputs.db_url_pooled }}
          BRANCH_DB_URL: ${{ steps.create_branch.outputs.db_url }}
          FALLBACK_DB_URL: ${{ secrets.DEV_DATABASE_URL }}

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Import legislators
        run: pnpm tsx src/scripts/import-legislators.ts

      - name: Seed test data
        run: pnpm seed:e2e

      - name: Build
        run: pnpm build
        env:
          TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

      - name: Create .dev.vars for wrangler
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .dev.vars
          echo "EMAIL_PROVIDER=smtp" >> .dev.vars
          echo "EMAIL_FROM=no-reply@democracy-direct.com" >> .dev.vars
          echo "SMTP_HOST=localhost" >> .dev.vars
          echo "SMTP_PORT=1025" >> .dev.vars
          echo "TURNSTILE_SITE_KEY=1x00000000000000000000AA" >> .dev.vars
          echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA" >> .dev.vars

      - name: Run Lighthouse CI
        id: lhci
        run: |
          pnpm exec lhci autorun 2>&1 | tee lhci-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Generate score summary
        if: always() && hashFiles('.lighthouseci/lhr-*.json') != ''
        id: summary
        run: |
          node << 'SCRIPT'
          const fs = require("fs");
          const { execSync } = require("child_process");

          const files = execSync("ls .lighthouseci/lhr-*.json")
            .toString()
            .trim()
            .split("\n");

          const results = files
            .map((f) => JSON.parse(fs.readFileSync(f, "utf8")))
            .filter((r) => r.categories?.performance?.score != null);

          if (results.length === 0) {
            fs.writeFileSync(
              "lighthouse-summary.md",
              "No valid Lighthouse results found.\n"
            );
            process.exit(0);
          }

          const grouped = {};
          for (const r of results) {
            const url = new URL(r.finalUrl);
            const page = url.pathname === "/" ? "/" : url.pathname;
            if (!grouped[page]) grouped[page] = [];
            grouped[page].push(r);
          }

          const icon = (score) => {
            if (score >= 90) return "\u{1F7E2}";
            if (score >= 50) return "\u{1F7E0}";
            return "\u{1F534}";
          };

          let md = "## Lighthouse CI Results\n\n";
          md += "| Page | Performance | Accessibility | Best Practices | SEO |\n";
          md += "|------|:-----------:|:------------:|:--------------:|:---:|\n";

          const sortedPages = Object.keys(grouped).sort();
          for (const page of sortedPages) {
            const runs = grouped[page];
            const avg = (cat) => {
              const scores = runs
                .map((r) => r.categories[cat]?.score)
                .filter((s) => s != null);
              if (scores.length === 0) return null;
              return Math.round(
                (scores.reduce((a, b) => a + b, 0) / scores.length) * 100
              );
            };

            const perf = avg("performance");
            const a11y = avg("accessibility");
            const bp = avg("best-practices");
            const seo = avg("seo");

            const fmt = (v) => (v != null ? `${icon(v)} ${v}` : "N/A");
            md += `| \`${page}\` | ${fmt(perf)} | ${fmt(a11y)} | ${fmt(bp)} | ${fmt(seo)} |\n`;
          }

          const lhciOutput = fs.existsSync("lhci-output.txt")
            ? fs.readFileSync("lhci-output.txt", "utf8")
            : "";
          const storageMatch = lhciOutput.match(
            /https:\/\/storage\.googleapis\.com\/lighthouse-infrastructure\.appspot\.com\/[^\s]+/
          );
          if (storageMatch) {
            md += `\n[View full Lighthouse report](${storageMatch[0]})\n`;
          }

          fs.writeFileSync("lighthouse-summary.md", md);
          SCRIPT

      - name: Post results to PR
        if: always() && hashFiles('lighthouse-summary.md') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('lighthouse-summary.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Lighthouse CI Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              });
            }

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-results
          path: |
            .lighthouseci/
            lhci-output.txt
          retention-days: 14

      - name: Fail if assertions failed
        if: always() && steps.lhci.outputs.exit_code != '0'
        run: exit 1

      - name: Delete Neon Branch
        if: always()
        uses: neondatabase/delete-branch-action@c2005bb7d7caeba12ba3ec63857e9c9f9a4d695a # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: lighthouse/pr-${{ github.event.number }}-${{ needs.setup-branch-name.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
