name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  typecheck:
    name: Type Check
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm typecheck

  test:
    name: Unit Tests
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest with coverage
        run: pnpm test --coverage

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-unit
          path: coverage/coverage-final.json

  setup-branch-name:
    name: Setup Branch Name
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5 # v8

  test-e2e:
    name: E2E Tests
    needs: [setup-branch-name]
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v6

      - name: Create Neon preview branch
        id: create_branch
        if: github.event_name == 'pull_request'
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup-branch-name.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Set DATABASE_URL
        run: |
          DB_URL="${BRANCH_DB_URL_POOLED:-${BRANCH_DB_URL:-${FALLBACK_DB_URL}}}"
          if [ -z "$DB_URL" ]; then
            echo "ERROR: DATABASE_URL could not be resolved"
            exit 1
          fi
          echo "DATABASE_URL is set (length: ${#DB_URL})"
          echo "DATABASE_URL=${DB_URL}" >> "$GITHUB_ENV"
        env:
          BRANCH_DB_URL_POOLED: ${{ steps.create_branch.outputs.db_url_pooled }}
          BRANCH_DB_URL: ${{ steps.create_branch.outputs.db_url }}
          FALLBACK_DB_URL: ${{ secrets.DEV_DATABASE_URL }}

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Ensure admin users
        run: pnpm ensure:admins
        env:
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}

      - name: Seed E2E test data
        run: pnpm seed:e2e

      - name: Import legislators
        run: pnpm tsx src/scripts/import-legislators.ts

      - name: Run integration tests with coverage
        run: pnpm test:integration --coverage

      - name: Upload integration test coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-integration
          path: coverage-integration/coverage-final.json

      - name: Create .dev.vars for wrangler
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .dev.vars
          echo "EMAIL_PROVIDER=smtp" >> .dev.vars
          echo "EMAIL_FROM=no-reply@democracy-direct.com" >> .dev.vars
          echo "SMTP_HOST=localhost" >> .dev.vars
          echo "SMTP_PORT=1025" >> .dev.vars
          echo "TURNSTILE_SITE_KEY=1x00000000000000000000AA" >> .dev.vars
          echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA" >> .dev.vars
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> .dev.vars
          echo "CONGRESS_API_KEY=$CONGRESS_API_KEY" >> .dev.vars
          echo "ADMIN_USERS=$ADMIN_USERS" >> .dev.vars
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}

      - name: Run Playwright tests
        run: pnpm test:e2e
        timeout-minutes: 10

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  coverage-report:
    name: Coverage Report
    needs: [test, test-e2e]
    if: always() && github.event.action != 'closed' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download unit test coverage
        uses: actions/download-artifact@v6
        with:
          name: coverage-unit
          path: coverage-unit

      - name: Download integration test coverage
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: coverage-integration
          path: coverage-integration

      # nyc merges Istanbul-format coverage JSON from different test types (unit + integration).
      # Vitest's --merge-reports is for sharded runs only, not different test environments.
      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          if [ -f coverage-integration/coverage-final.json ]; then
            mkdir -p coverage-all
            cp coverage-unit/coverage-final.json coverage-all/unit.json
            cp coverage-integration/coverage-final.json coverage-all/integration.json
            pnpm nyc merge coverage-all coverage/coverage-final.json
          else
            pnpm nyc merge coverage-unit coverage/coverage-final.json
          fi
          pnpm nyc report --reporter=json-summary --temp-dir=coverage --report-dir=coverage

      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@15b5b41bb7d36796d89f4bf482b09529c53f3446 # v2.9.2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

  build:
    name: Build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

  deploy-migrations:
    name: Run Production Migrations
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  cleanup-preview-db:
    name: Delete Preview Database
    needs: setup-branch-name
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@c2005bb7d7caeba12ba3ec63857e9c9f9a4d695a # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup-branch-name.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
