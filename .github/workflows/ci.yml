name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest with coverage
        run: pnpm test --coverage

      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@15b5b41bb7d36796d89f4bf482b09529c53f3446 # v2.9.2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Push database schema
        run: pnpm drizzle-kit push --force
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

      - name: Ensure admin users
        run: pnpm ensure:admins
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}

      - name: Seed E2E test data
        run: pnpm seed:e2e
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

      - name: Import legislators
        run: pnpm tsx src/scripts/import-legislators.ts
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

      - name: Create .dev.vars for wrangler
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .dev.vars
          echo "EMAIL_PROVIDER=smtp" >> .dev.vars
          echo "EMAIL_FROM=no-reply@democracy-direct.com" >> .dev.vars
          echo "SMTP_HOST=localhost" >> .dev.vars
          echo "SMTP_PORT=1025" >> .dev.vars
          echo "TURNSTILE_SITE_KEY=1x00000000000000000000AA" >> .dev.vars
          echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA" >> .dev.vars
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> .dev.vars
          echo "CONGRESS_API_KEY=$CONGRESS_API_KEY" >> .dev.vars
          echo "ADMIN_USERS=$ADMIN_USERS" >> .dev.vars
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}

      - name: Run Playwright tests
        run: pnpm test:e2e
        timeout-minutes: 10

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
